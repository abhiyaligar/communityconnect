name: Deploy Backend to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1  # Change to your target region (e.g. us-central1)
  GAR_REPO: community-backend  # Name of your Artifact Registry Docker repository
  SERVICE_NAME: communityconnect-backend

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found, skipping."
          fi

  deploy-to-gcp:
    name: Build & Deploy to GCP
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required if using Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authentication using Workload Identity Federation (Recommended)
      # Or alternatively using Service Account Key JSON
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # If using Workload Identity Federation (Secure & recommended):
          # workload_identity_provider: ${{ secrets.GCP_WIP_PROVIDER }}
          # service_account: ${{ secrets.GCP_SA_EMAIL }}
          
          # If using Service Account Key JSON (Simpler to set up initially):
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:latest"
          
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./backend
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --set-secrets=/secrets/.env=community-backend-env:latest
            --set-env-vars=ENV_FILE=/secrets/.env
      - name: Show Deploy URL
        run: echo "Backend deployed successfully to ${{ steps.deploy.outputs.url }}"
